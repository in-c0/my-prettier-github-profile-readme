name: Profile cards

on:
  schedule:
    - cron: '23 19 * * *' # daily, ~6am Sydney
  workflow_dispatch:
  push:
    branches: [main]
    paths: [profile.config.json, index.html, src/**, scripts/**, assets/**, site/**, .github/workflows/cards.yml]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install image resizer (optional, shrinks remote images)
        run: npm install --no-save --no-package-lock sharp@0.33.5
      - name: Render SVG cards
        uses: ./
        with:
          config: profile.config.json
          out: dist
          # Optional: a personal access token in the PROFILE_TOKEN secret lets the cards
          # include private activity (counts only) when "activity.private" is true.
          token: ${{ secrets.PROFILE_TOKEN || github.token }}
      - name: Publish cards to the output branch
        run: |
          cd dist
          git init -q -b output
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -qm "Update profile cards"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Assemble the docs site
        run: |
          mkdir -p _site/data
          cp -r index.html site src assets profile.config.json _site/
          cp data/sample-activity.json _site/data/
          cp dist/activity.json _site/data/activity.json
          # Version every asset URL so a deploy is never hidden behind the 10-minute Pages cache.
          V=${GITHUB_SHA::8}
          sed -i -E "s#(href|src)=\"(site/[^\"]+)\"#\1=\"\2?v=$V\"#g" _site/index.html
          sed -i -E "s#(from '\.{1,2}/[^']+\.js)'#\1?v=$V'#g" _site/site/*.js _site/src/core/*.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Requires Settings → Pages → Source: "GitHub Actions". Skipped quietly otherwise.
  pages:
    needs: cards
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
